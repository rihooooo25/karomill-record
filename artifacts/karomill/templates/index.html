<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>カロミル記録</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --card: #22263a;
      --accent: #4f8ef7;
      --accent2: #6c63ff;
      --success: #34d399;
      --error: #f87171;
      --text: #e8eaf0;
      --text-muted: #8b90a7;
      --border: #2e3250;
      --radius: 16px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 24px 16px 40px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }
    header .logo {
      font-size: 28px;
      margin-bottom: 6px;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 20px;
      width: 100%;
      max-width: 420px;
    }

    /* ─── 画像選択エリア ─── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 12px;
      padding: 32px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      overflow: hidden;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(79,142,247,0.05);
    }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer;
    }
    .upload-zone .icon {
      font-size: 48px;
      display: block;
      margin-bottom: 10px;
    }
    .upload-zone .label {
      font-size: 15px;
      font-weight: 600;
      color: var(--accent);
    }
    .upload-zone .sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* プレビュー（複数サムネイル） */
    #preview-wrap {
      margin-top: 16px;
      display: none;
    }
    #preview-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .thumb-item {
      position: relative;
      width: calc(33.3% - 6px);
      aspect-ratio: 1;
    }
    .thumb-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }
    .thumb-item .thumb-remove {
      position: absolute;
      top: 4px; right: 4px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      border: none;
      border-radius: 50%;
      width: 22px; height: 22px;
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .thumb-item .thumb-status {
      position: absolute;
      bottom: 4px; left: 4px; right: 4px;
      background: rgba(0,0,0,0.65);
      color: #fff;
      font-size: 10px;
      text-align: center;
      border-radius: 4px;
      padding: 2px 4px;
    }
    #preview-clear-all {
      margin-top: 8px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
    }

    /* 送信ボタン */
    .btn-send {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
    }
    .btn-send:active { transform: scale(0.98); }
    .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ─── ローディング ─── */
    #loading {
      display: none;
      margin-top: 24px;
      text-align: center;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading-text {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* ─── 結果エリア ─── */
    #result {
      display: none;
      margin-top: 20px;
    }
    .result-box {
      border-radius: 12px;
      padding: 16px;
      font-size: 14px;
      line-height: 1.7;
    }
    .result-box.success {
      background: rgba(52,211,153,0.1);
      border: 1px solid rgba(52,211,153,0.35);
      color: var(--success);
    }
    .result-box.error {
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.35);
      color: var(--error);
    }
    .result-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .result-detail {
      font-size: 13px;
      margin-top: 10px;
      color: var(--text-muted);
    }
    .result-detail strong { color: var(--text); }

    /* Geminiテキスト */
    #gemini-output {
      display: none;
      margin-top: 16px;
    }
    #gemini-output summary {
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      padding: 8px 12px;
      background: var(--surface);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    #gemini-output pre {
      margin-top: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 14px;
      font-size: 12px;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 300px;
      overflow-y: auto;
      font-family: 'SF Mono', monospace;
    }

    /* リセットボタン */
    #btn-reset {
      display: none;
      margin-top: 14px;
      width: 100%;
      padding: 13px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🥗</div>
    <h1>カロミル自動記録</h1>
    <p>スクショをアップロード → スプレッドシートへ自動書き込み</p>
  </header>

  <div class="card">

    <!-- 画像選択 -->
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" accept="image/*" multiple />
      <span class="icon">📷</span>
      <span class="label">スクショを選択（複数可）</span>
      <span class="sub">カロミルの食事・体重スクリーンショット</span>
    </div>

    <!-- プレビュー（複数サムネイル） -->
    <div id="preview-wrap">
      <div id="preview-grid"></div>
      <button id="preview-clear-all">すべてクリア</button>
    </div>

    <!-- 送信ボタン -->
    <button class="btn-send" id="btn-send" disabled>送信・記録する</button>

    <!-- ローディング -->
    <div id="loading">
      <div class="spinner"></div>
      <div id="loading-text">AI解析中...</div>
    </div>

    <!-- 結果 -->
    <div id="result"></div>

    <!-- Gemini出力（折りたたみ） -->
    <details id="gemini-output">
      <summary>📋 AIの解析テキストを表示</summary>
      <pre id="gemini-pre"></pre>
    </details>

    <!-- リセット -->
    <button id="btn-reset">↩ 別の画像を送る</button>

  </div>

  <script>
    const fileInput     = document.getElementById('file-input');
    const uploadZone    = document.getElementById('upload-zone');
    const previewWrap   = document.getElementById('preview-wrap');
    const previewGrid   = document.getElementById('preview-grid');
    const previewClearAll = document.getElementById('preview-clear-all');
    const btnSend       = document.getElementById('btn-send');
    const loading       = document.getElementById('loading');
    const loadingText   = document.getElementById('loading-text');
    const resultDiv     = document.getElementById('result');
    const geminiOut     = document.getElementById('gemini-output');
    const geminiPre     = document.getElementById('gemini-pre');
    const btnReset      = document.getElementById('btn-reset');

    // 選択ファイル一覧 [{file, objectUrl}]
    let selectedFiles = [];

    // ── ファイル追加 ──────────────────────────
    function addFiles(newFiles) {
      for (const f of newFiles) {
        if (!f.type.startsWith('image/')) continue;
        selectedFiles.push({ file: f, objectUrl: URL.createObjectURL(f) });
      }
      renderThumbs();
      updateSendBtn();
    }

    fileInput.addEventListener('change', e => {
      addFiles(Array.from(e.target.files));
      fileInput.value = ''; // 同じファイルを再選択できるようリセット
    });

    uploadZone.addEventListener('dragover', e => {
      e.preventDefault();
      uploadZone.classList.add('drag-over');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('drag-over');
      addFiles(Array.from(e.dataTransfer.files));
    });

    // ── サムネイル描画 ───────────────────────
    function renderThumbs() {
      previewGrid.innerHTML = '';
      selectedFiles.forEach((item, idx) => {
        const wrap = document.createElement('div');
        wrap.className = 'thumb-item';
        wrap.innerHTML = `
          <img src="${item.objectUrl}" alt="画像${idx+1}" />
          <button class="thumb-remove" data-idx="${idx}" title="削除">✕</button>
          <span class="thumb-status" id="thumb-status-${idx}"></span>`;
        previewGrid.appendChild(wrap);
      });
      previewWrap.style.display = selectedFiles.length ? 'block' : 'none';
      resultDiv.style.display = 'none';
      geminiOut.style.display = 'none';
      btnReset.style.display = 'none';

      // 削除ボタン
      previewGrid.querySelectorAll('.thumb-remove').forEach(btn => {
        btn.addEventListener('click', e => {
          const i = parseInt(e.currentTarget.dataset.idx);
          URL.revokeObjectURL(selectedFiles[i].objectUrl);
          selectedFiles.splice(i, 1);
          renderThumbs();
          updateSendBtn();
        });
      });
    }

    previewClearAll.addEventListener('click', reset);

    function updateSendBtn() {
      btnSend.disabled = selectedFiles.length === 0;
    }

    // ── 送信（順番に1枚ずつ処理）───────────────
    btnSend.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      btnSend.disabled = true;
      resultDiv.style.display = 'none';
      geminiOut.style.display = 'none';
      btnReset.style.display = 'none';

      const results = [];
      const geminiTexts = [];

      for (let i = 0; i < selectedFiles.length; i++) {
        const { file } = selectedFiles[i];
        const statusEl = document.getElementById(`thumb-status-${i}`);
        if (statusEl) statusEl.textContent = '⏳ 解析中';

        setLoading(true, `AI解析中… (${i + 1}/${selectedFiles.length})`);

        const fd = new FormData();
        fd.append('image', file);

        try {
          const resp = await fetch('/upload', { method: 'POST', body: fd });
          const json = await resp.json();
          results.push(json);
          if (json.gemini_text) geminiTexts.push(json.gemini_text);
          if (statusEl) statusEl.textContent = json.success ? '✅' : '❌';
        } catch (err) {
          results.push({ success: false, error: 'ネットワークエラー: ' + err.message });
          if (statusEl) statusEl.textContent = '❌';
        }
      }

      setLoading(false);
      showResults(results);

      if (geminiTexts.length) {
        geminiOut.style.display = 'block';
        geminiPre.textContent = geminiTexts.join('\n\n─────────────────\n\n');
      }
    });

    btnReset.addEventListener('click', reset);

    // ── ローディング ─────────────────────────
    function setLoading(on, text) {
      loading.style.display = on ? 'block' : 'none';
      loadingText.textContent = text || '';
    }

    // ── 結果表示 ─────────────────────────────
    function showResults(results) {
      resultDiv.style.display = 'block';
      btnReset.style.display = 'block';

      const html = results.map((json, i) => {
        if (json.success) {
          return `<div class="result-box success" style="margin-bottom:10px">
            <div class="result-title">✅ 画像${i+1} 記録完了</div>
            <div>タブ: <strong>${json.tab}</strong></div>
            <div>日付: <strong>${json.date}</strong> / 体重: <strong>${json.weight} kg</strong></div>
          </div>`;
        } else {
          return `<div class="result-box error" style="margin-bottom:10px">
            <div class="result-title">❌ 画像${i+1} エラー</div>
            <div>${escHtml(json.error || '不明なエラー')}</div>
          </div>`;
        }
      }).join('');

      resultDiv.innerHTML = html;
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function reset() {
      selectedFiles.forEach(f => URL.revokeObjectURL(f.objectUrl));
      selectedFiles = [];
      fileInput.value = '';
      previewGrid.innerHTML = '';
      previewWrap.style.display = 'none';
      btnSend.disabled = true;
      resultDiv.style.display = 'none';
      geminiOut.style.display = 'none';
      btnReset.style.display = 'none';
      loading.style.display = 'none';
    }
  </script>
</body>
</html>
