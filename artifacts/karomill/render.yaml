services:
  - type: web
    name: karomill
    runtime: python
    rootDir: artifacts/karomill
    buildCommand: DEBIAN_FRONTEND=noninteractive apt-get install -y ffmpeg && pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # Renderダッシュボードで手動設定
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false          # Renderダッシュボードで手動設定
      - key: BASIC_AUTH_USERNAME
        sync: false          # Renderダッシュボードで手動設定
      - key: BASIC_AUTH_PASSWORD
        sync: false          # Renderダッシュボードで手動設定
