kind = "api"
previewPath = "/"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/api-server", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "--enable-source-maps", "artifacts/api-server/dist/index.mjs"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"

[[services]]
localPort = 5000
name = "Karomill"
paths = ["/"]

[services.development]
run = "python3 /home/runner/workspace/artifacts/karomill/app.py"

[services.production.run]
args = ["gunicorn", "-w", "2", "-b", "0.0.0.0:5000", "--chdir", "/home/runner/workspace/artifacts/karomill", "app:app"]

[services.production.run.env]
PORT = "5000"
